name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Versions name the same release
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          version = open("VERSION", encoding="utf-8").read().strip()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("api/pom.xml").getroot()
          pom_version = root.find("m:version", ns).text
          web_version = json.load(open("web/package.json", encoding="utf-8"))["version"]
          web_name = json.load(open("web/package.json", encoding="utf-8"))["name"]
          if pom_version != version or web_version != version:
              raise SystemExit(f"VERSION {version} diverges from Maven {pom_version} or npm {web_version}")
          if web_name != "skillforge" or root.find("m:artifactId", ns).text != "skillforge":
              raise SystemExit("repository, package and interface must share the name skillforge")
          PY
      - name: Verify the API
        working-directory: api
        run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, lint, typecheck, test and build
        working-directory: web
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the start script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/start.sh

  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, script]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the annotated SemVer tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            existing="$(git rev-parse "${tag}^{}")"
            head="$(git rev-parse HEAD)"
            if [[ "$existing" != "$head" ]]; then
              echo "Tag ${tag} already points at ${existing}. Bump VERSION." >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "skillforge ${version}"
          git push origin "$tag"

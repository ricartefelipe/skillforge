spring:
  application:
    name: skillforge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillforge}
    username: ${SPRING_DATASOURCE_USERNAME:skillforge}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # The pool must open even when Postgres is down, so liveness can still answer.
      initialization-fail-timeout: -1
      connection-timeout: 3000
      validation-timeout: 2000

skillforge:
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/skillforge}
  identity-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Probes stay on the public port and do not require a session.
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          # Postgres and the identity provider are required before the institution is served.
          include: readinessState,db,identityProvider
